name: Documentation

on:
  push:
    branches: [master]
    paths:
      - 'gem/*/lib/**'
      - 'docs/**'
      - '.yardopts'
      - '.github/workflows/docs.yml'
      - 'Rakefile'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      # YARD generation — uses the SDK root Gemfile
      - name: Set up Ruby (YARD)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Generate YARD markdown
        run: bundle exec rake docs:generate

      # Jekyll build — uses docs/Gemfile (separate bundler-cache key)
      - name: Set up Ruby (Jekyll)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          working-directory: docs
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec rake docs:build

      - name: Lint docs frontmatter
        run: bundle exec rake docs:lint

      # Offline link check against the built site
      - name: Check links with lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --include-fragments --no-progress docs/_site
          fail: true

      # Upload artefact for the deploy job
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

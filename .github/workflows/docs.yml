name: Documentation

on:
  push:
    branches: [master]
    paths:
      - 'gem/*/lib/**'
      - 'docs/**'
      - '.yardopts'
      - '.github/workflows/docs.yml'
      - 'Rakefile'
  pull_request:
    branches: [master]
    paths:
      - 'gem/*/lib/**'
      - 'docs/**'
      - '.yardopts'
      - '.github/workflows/docs.yml'
      - 'Rakefile'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # configure-pages requires both — without them the build job fails
      # before the artefact is uploaded. Same set as the deploy job below.
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      # YARD generation — uses the SDK root Gemfile.
      # Both setup-ruby steps use Ruby 3.4 to match docs/Gemfile.lock's
      # RUBY VERSION pin (3.4.2). Splitting Ruby versions between the two
      # steps breaks `bundle exec rake docs:*` because the rake command
      # resolves through the root Gemfile, whose gems were installed under
      # the first setup-ruby's Ruby version.
      - name: Set up Ruby (YARD)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Generate YARD markdown
        run: bundle exec rake docs:generate

      # Jekyll build — uses docs/Gemfile (separate bundler-cache key)
      - name: Set up Ruby (Jekyll)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          working-directory: docs
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec rake docs:build

      - name: Lint docs frontmatter
        run: bundle exec rake docs:lint

      # Offline link + anchor check via html-proofer (Jekyll-aware: handles
      # the baseurl prefix via swap_urls; lychee can't resolve root-relative
      # URLs against a local _site tree).
      - name: Check internal links
        run: bundle exec rake docs:proofread

      # Upload artefact for the deploy job — skipped on PR runs since
      # the deploy job is also skipped (only push to master deploys).
      - uses: actions/configure-pages@v5
        if: github.event_name == 'push'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: docs/_site

  deploy:
    # Only deploy on push to master. PR runs are dry-run only: they
    # build, lint, and link-check the site without touching Pages.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

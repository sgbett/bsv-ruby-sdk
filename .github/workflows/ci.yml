name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['3.3', '3.4', '4.0']

    steps:
      - uses: actions/checkout@v6

      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Cache conformance vectors
        uses: actions/cache@v6
        with:
          path: tmp/conformance-vectors
          key: conformance-${{ hashFiles('.architecture/conformance.lock') }}

      - name: Sync conformance vectors
        run: bin/conformance/sync

      - name: Run specs
        run: bundle exec rake
        env:
          COVERAGE: ${{ matrix.ruby-version == '4.0' && 'true' || '' }}
          BSV_INTEGRATION: ${{ matrix.ruby-version == '4.0' && 'true' || '' }}

      - name: Upload coverage
        if: matrix.ruby-version == '4.0'
        uses: codecov/codecov-action@v7
        with:
          files: coverage/coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Run RuboCop
        run: bundle exec rubocop

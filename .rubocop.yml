plugins:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 2.7
  NewCops: enable
  SuggestExtensions: false

Style/Documentation:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'

Naming/FileName:
  Exclude:
    - 'lib/bsv-sdk.rb'
    - 'lib/bsv-attest.rb'
    - 'lib/bsv-wallet.rb'

# Cryptographic code uses standard short names (r, s, x, y, n, m, bn, etc.)
# a/b are used in secure_compare for constant-time comparison.
Naming/MethodParameterName:
  AllowedNames:
    - a
    - b
    - r
    - s
    - z
    - x
    - y
    - n
    - m
    - bn
    - tx
    - p1
    - p2

# BRC-100 method names use get_ prefix (get_height, get_header, etc.) — protocol names.
Naming/AccessorMethodName:
  Exclude:
    - 'lib/bsv/wallet_interface/**/*'
    - 'spec/bsv/wallet_interface/**/*'

# verify(), verify_proof(), and cast_bool() are standard cryptographic/protocol API names.
# is_authenticated is the BRC-100 wire-protocol method name and cannot be renamed.
# delete_output/delete_certificate return bool success indicators, not predicates.
Naming/PredicateMethod:
  AllowedMethods:
    - verify
    - verify_proof
    - cast_bool
    - execute
    - is_authenticated
    - delete_output
    - delete_certificate

# is_authenticated uses the BRC-100 wire-protocol naming convention (is_ prefix).
Naming/PredicatePrefix:
  AllowedMethods:
    - is_authenticated

# Cryptographic and script-parsing code is inherently complex;
# splitting into tiny methods would harm readability and auditability.
Metrics/AbcSize:
  Exclude:
    - 'lib/bsv/primitives/**/*'
    - 'lib/bsv/script/**/*'
    - 'lib/bsv/transaction/**/*'
    - 'lib/bsv/network/**/*'
    - 'lib/bsv/wallet/**/*'
    - 'lib/bsv/attest.rb'
    - 'lib/bsv/attest/**/*'
    - 'lib/bsv/wallet_interface.rb'
    - 'lib/bsv/wallet_interface/**/*'
    - 'spec/**/*'

Metrics/MethodLength:
  Exclude:
    - 'lib/bsv/primitives/**/*'
    - 'lib/bsv/script/**/*'
    - 'lib/bsv/transaction/**/*'
    - 'lib/bsv/network/**/*'
    - 'lib/bsv/wallet/**/*'
    - 'lib/bsv/attest.rb'
    - 'lib/bsv/attest/**/*'
    - 'lib/bsv/wallet_interface.rb'
    - 'lib/bsv/wallet_interface/**/*'
    - 'spec/**/*'

Metrics/CyclomaticComplexity:
  Exclude:
    - 'lib/bsv/primitives/**/*'
    - 'lib/bsv/script/**/*'
    - 'lib/bsv/transaction/**/*'
    - 'lib/bsv/network/**/*'
    - 'lib/bsv/wallet/**/*'
    - 'lib/bsv/attest.rb'
    - 'lib/bsv/attest/**/*'
    - 'lib/bsv/wallet_interface.rb'
    - 'lib/bsv/wallet_interface/**/*'
    - 'spec/**/*'

Metrics/PerceivedComplexity:
  Exclude:
    - 'lib/bsv/primitives/**/*'
    - 'lib/bsv/script/**/*'
    - 'lib/bsv/transaction/**/*'
    - 'lib/bsv/network/**/*'
    - 'lib/bsv/wallet/**/*'
    - 'lib/bsv/attest.rb'
    - 'lib/bsv/attest/**/*'
    - 'lib/bsv/wallet_interface.rb'
    - 'lib/bsv/wallet_interface/**/*'
    - 'spec/**/*'

Metrics/ModuleLength:
  Exclude:
    - 'lib/bsv/primitives/ecdsa.rb'
    - 'lib/bsv/script/opcodes.rb'
    - 'lib/bsv/script/interpreter/operations/**/*'
    - 'spec/**/*'

Metrics/ClassLength:
  Exclude:
    - 'lib/bsv/primitives/**/*'
    - 'lib/bsv/script/**/*'
    - 'lib/bsv/transaction/transaction.rb'
    - 'lib/bsv/transaction/merkle_path.rb'
    - 'lib/bsv/transaction/beef.rb'
    - 'lib/bsv/wallet_interface/**/*'

Metrics/ParameterLists:
  Exclude:
    - 'lib/bsv/primitives/**/*'
    - 'lib/bsv/script/**/*'
    - 'lib/bsv/transaction/**/*'

# The interpreter condition stack uses :true/:false symbols intentionally
# (matching the Go SDK pattern) to distinguish from boolean values.
Lint/BooleanSymbol:
  Exclude:
    - 'lib/bsv/script/interpreter/**/*'

Layout/LineLength:
  Max: 150
  Exclude:
    - 'spec/**/*'

RSpec/ContextWording:
  Exclude:
    - 'spec/bsv/primitives/**/*'

# Specs for low-level modules legitimately need multiple assertions
# per example and longer examples for thorough test coverage.
RSpec/MultipleExpectations:
  Exclude:
    - 'spec/bsv/primitives/**/*'
    - 'spec/bsv/script/**/*'
    - 'spec/bsv/transaction/**/*'
    - 'spec/bsv/network/**/*'
    - 'spec/bsv/wallet/**/*'
    - 'spec/bsv/attest_spec.rb'
    - 'spec/bsv/attest/**/*'
    - 'spec/bsv/wallet_interface/**/*'
    - 'spec/integration/**/*'
    - 'spec/conformance/**/*'

RSpec/MultipleMemoizedHelpers:
  Exclude:
    - 'spec/bsv/primitives/**/*'
    - 'spec/bsv/script/**/*'
    - 'spec/bsv/transaction/**/*'
    - 'spec/conformance/**/*'
    - 'spec/bsv/wallet_interface/**/*'

RSpec/ExampleLength:
  Exclude:
    - 'spec/bsv/primitives/**/*'
    - 'spec/bsv/script/**/*'
    - 'spec/bsv/transaction/**/*'
    - 'spec/bsv/network/**/*'
    - 'spec/bsv/wallet/**/*'
    - 'spec/bsv/attest_spec.rb'
    - 'spec/bsv/attest/**/*'
    - 'spec/bsv/wallet_interface/**/*'
    - 'spec/integration/**/*'
    - 'spec/conformance/**/*'

# Bitcoin opcodes use numbered names (OP_1, OP_2, etc.) — protocol constants.
Naming/VariableNumber:
  Exclude:
    - 'spec/**/*'

# Interpreter sub-specs and conformance specs legitimately describe parent
# classes or use string descriptions for cross-cutting vector suites.
RSpec/SpecFilePathFormat:
  Exclude:
    - 'spec/bsv/transaction/p2pkh_spec.rb'
    - 'spec/bsv/script/interpreter/**/*'
    - 'spec/bsv/primitives/shamir/**/*'
    - 'spec/bsv/transaction/benford_number/**/*'
    - 'spec/bsv/script/op_cat_spec.rb'
    - 'spec/conformance/**/*'
    - 'spec/bsv/wallet_interface/**/*'

# Vector and conformance specs use string describes for cross-cutting test suites.
RSpec/DescribeClass:
  Exclude:
    - 'spec/bsv/transaction/tx_vectors_spec.rb'
    - 'spec/bsv/transaction/sighash_vectors_spec.rb'
    - 'spec/bsv/script/interpreter/script_vectors_spec.rb'
    - 'spec/integration/**/*'
    - 'spec/conformance/**/*'
    - 'spec/bsv/wallet_interface/**/*'

# Vector specs define constants at spec scope for shared test infrastructure.
Lint/ConstantDefinitionInBlock:
  Exclude:
    - 'spec/bsv/script/interpreter/script_vectors_spec.rb'

RSpec/LeakyConstantDeclaration:
  Exclude:
    - 'spec/bsv/script/interpreter/script_vectors_spec.rb'

# Dynamic test generation produces describe blocks populated at runtime.
RSpec/EmptyExampleGroup:
  Exclude:
    - 'spec/bsv/script/interpreter/script_vectors_spec.rb'

# wallet_interface spec file covers multiple top-level modules in one file.
RSpec/MultipleDescribes:
  Exclude:
    - 'spec/bsv/wallet_interface/**/*'

# Dynamic each loops with the same template string produce unique descriptions at runtime.
RSpec/RepeatedDescription:
  Exclude:
    - 'spec/bsv/wallet_interface/**/*'

# Integration tests use before(:context) which requires instance variables.
RSpec/BeforeAfterAll:
  Exclude:
    - 'spec/integration/**/*'

RSpec/InstanceVariable:
  Exclude:
    - 'spec/integration/**/*'

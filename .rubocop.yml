plugins:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 2.7
  NewCops: enable
  SuggestExtensions: false

Style/Documentation:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'

Naming/FileName:
  Exclude:
    - 'lib/bsv-sdk.rb'

# Cryptographic code uses standard short names (r, s, bn, etc.)
Naming/MethodParameterName:
  AllowedNames:
    - r
    - s
    - bn
    - tx

# verify() is the standard cryptographic API name
Naming/PredicateMethod:
  AllowedMethods:
    - verify

# Cryptographic and script-parsing code is inherently complex;
# splitting into tiny methods would harm readability and auditability.
Metrics/AbcSize:
  Exclude:
    - 'lib/bsv/primitives/**/*'
    - 'lib/bsv/script/**/*'
    - 'lib/bsv/transaction/**/*'
    - 'lib/bsv/network/**/*'
    - 'lib/bsv/wallet/**/*'

Metrics/MethodLength:
  Exclude:
    - 'lib/bsv/primitives/**/*'
    - 'lib/bsv/script/**/*'
    - 'lib/bsv/transaction/**/*'
    - 'lib/bsv/network/**/*'
    - 'lib/bsv/wallet/**/*'
    - 'spec/support/**/*'

Metrics/CyclomaticComplexity:
  Exclude:
    - 'lib/bsv/primitives/**/*'
    - 'lib/bsv/script/**/*'
    - 'lib/bsv/transaction/**/*'
    - 'lib/bsv/network/**/*'
    - 'lib/bsv/wallet/**/*'

Metrics/PerceivedComplexity:
  Exclude:
    - 'lib/bsv/primitives/**/*'
    - 'lib/bsv/script/**/*'
    - 'lib/bsv/transaction/**/*'
    - 'lib/bsv/network/**/*'
    - 'lib/bsv/wallet/**/*'

Metrics/ModuleLength:
  Exclude:
    - 'lib/bsv/script/opcodes.rb'

Metrics/ClassLength:
  Exclude:
    - 'lib/bsv/script/script.rb'
    - 'lib/bsv/transaction/transaction.rb'

# Specs for low-level modules legitimately need multiple assertions
# per example and longer examples for thorough test coverage.
RSpec/MultipleExpectations:
  Exclude:
    - 'spec/bsv/primitives/**/*'
    - 'spec/bsv/script/**/*'
    - 'spec/bsv/transaction/**/*'
    - 'spec/bsv/network/**/*'
    - 'spec/bsv/wallet/**/*'
    - 'spec/integration/**/*'

RSpec/ExampleLength:
  Exclude:
    - 'spec/bsv/primitives/**/*'
    - 'spec/bsv/script/**/*'
    - 'spec/bsv/transaction/**/*'
    - 'spec/bsv/network/**/*'
    - 'spec/bsv/wallet/**/*'
    - 'spec/integration/**/*'

# Integration tests use before(:context) which requires instance variables.
RSpec/InstanceVariable:
  Exclude:
    - 'spec/integration/**/*'

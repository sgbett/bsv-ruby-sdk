plugins:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 2.7
  NewCops: enable
  SuggestExtensions: false

Style/Documentation:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'

Naming/FileName:
  Exclude:
    - 'lib/bsv-sdk.rb'
    - 'lib/bsv-attest.rb'

# Cryptographic code uses standard short names (r, s, bn, etc.)
Naming/MethodParameterName:
  AllowedNames:
    - r
    - s
    - z
    - bn
    - tx
    - p1
    - p2

# verify() and verify_proof() are standard cryptographic API names
Naming/PredicateMethod:
  AllowedMethods:
    - verify
    - verify_proof

# Cryptographic and script-parsing code is inherently complex;
# splitting into tiny methods would harm readability and auditability.
Metrics/AbcSize:
  Exclude:
    - 'lib/bsv/primitives/**/*'
    - 'lib/bsv/script/**/*'
    - 'lib/bsv/transaction/**/*'
    - 'lib/bsv/network/**/*'
    - 'lib/bsv/wallet/**/*'
    - 'lib/bsv/attest.rb'
    - 'lib/bsv/attest/**/*'

Metrics/MethodLength:
  Exclude:
    - 'lib/bsv/primitives/**/*'
    - 'lib/bsv/script/**/*'
    - 'lib/bsv/transaction/**/*'
    - 'lib/bsv/network/**/*'
    - 'lib/bsv/wallet/**/*'
    - 'spec/support/**/*'
    - 'lib/bsv/attest.rb'
    - 'lib/bsv/attest/**/*'

Metrics/CyclomaticComplexity:
  Exclude:
    - 'lib/bsv/primitives/**/*'
    - 'lib/bsv/script/**/*'
    - 'lib/bsv/transaction/**/*'
    - 'lib/bsv/network/**/*'
    - 'lib/bsv/wallet/**/*'
    - 'lib/bsv/attest.rb'
    - 'lib/bsv/attest/**/*'

Metrics/PerceivedComplexity:
  Exclude:
    - 'lib/bsv/primitives/**/*'
    - 'lib/bsv/script/**/*'
    - 'lib/bsv/transaction/**/*'
    - 'lib/bsv/network/**/*'
    - 'lib/bsv/wallet/**/*'
    - 'lib/bsv/attest.rb'
    - 'lib/bsv/attest/**/*'

Metrics/ModuleLength:
  Exclude:
    - 'lib/bsv/primitives/ecdsa.rb'
    - 'lib/bsv/script/opcodes.rb'

Metrics/ParameterLists:
  Exclude:
    - 'lib/bsv/primitives/**/*'
    - 'lib/bsv/script/**/*'
    - 'lib/bsv/transaction/**/*'

Metrics/ClassLength:
  Exclude:
    - 'lib/bsv/primitives/**/*'
    - 'lib/bsv/script/script.rb'
    - 'lib/bsv/transaction/transaction.rb'
    - 'lib/bsv/transaction/merkle_path.rb'
    - 'lib/bsv/transaction/beef.rb'

Layout/LineLength:
  Exclude:
    - 'spec/bsv/primitives/**/*'

RSpec/ContextWording:
  Exclude:
    - 'spec/bsv/primitives/**/*'

# Specs for low-level modules legitimately need multiple assertions
# per example and longer examples for thorough test coverage.
RSpec/MultipleExpectations:
  Exclude:
    - 'spec/bsv/primitives/**/*'
    - 'spec/bsv/script/**/*'
    - 'spec/bsv/transaction/**/*'
    - 'spec/bsv/network/**/*'
    - 'spec/bsv/wallet/**/*'
    - 'spec/bsv/attest_spec.rb'
    - 'spec/bsv/attest/**/*'
    - 'spec/integration/**/*'

RSpec/MultipleMemoizedHelpers:
  Exclude:
    - 'spec/bsv/primitives/**/*'

RSpec/ExampleLength:
  Exclude:
    - 'spec/bsv/primitives/**/*'
    - 'spec/bsv/script/**/*'
    - 'spec/bsv/transaction/**/*'
    - 'spec/bsv/network/**/*'
    - 'spec/bsv/wallet/**/*'
    - 'spec/bsv/attest_spec.rb'
    - 'spec/bsv/attest/**/*'
    - 'spec/integration/**/*'

# Integration tests use before(:context) which requires instance variables.
RSpec/InstanceVariable:
  Exclude:
    - 'spec/integration/**/*'

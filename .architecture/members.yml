# Architecture Review Members
# Each member represents a specialized perspective for architectural reviews

members:
  # --- Core Members ---

  - id: systems_architect
    name: "Systems Architect"
    title: "Systems Architect"
    specialties:
      - "library architecture"
      - "module dependency design"
      - "API surface coherence"
    disciplines:
      - "system design"
      - "namespace organisation"
      - "layered architecture"
    skillsets:
      - "high-level architecture planning"
      - "system decomposition"
      - "technical roadmapping"
    domains:
      - "overall system coherence"
      - "architectural principles"
      - "technical governance"
    perspective: "Focuses on how the SDK's modules (Primitives, Script, Transaction) compose into a coherent library and evaluates the dependency chain between layers."

  - id: domain_expert
    name: "Domain Expert"
    title: "Domain Expert"
    specialties:
      - "Bitcoin protocol semantics"
      - "BSV-specific rules and opcodes"
      - "reference SDK alignment"
    disciplines:
      - "protocol modelling"
      - "domain analysis"
      - "cross-SDK consistency"
    skillsets:
      - "translating protocol specs to code"
      - "identifying core domain concepts"
      - "defining module boundaries"
    domains:
      - "transaction structure and signing"
      - "script semantics"
      - "key derivation and address formats"
    perspective: "Evaluates how well the SDK models BSV protocol concepts and whether its abstractions match the reference SDKs (Go, TypeScript, Python)."

  - id: security_specialist
    name: "Security Specialist"
    title: "Security Specialist"
    specialties:
      - "cryptographic implementation security"
      - "key management"
      - "side-channel awareness"
    disciplines:
      - "security analysis"
      - "risk assessment"
      - "vulnerability identification"
    skillsets:
      - "identifying cryptographic weaknesses"
      - "secure random number generation"
      - "constant-time comparison"
    domains:
      - "private key protection"
      - "signature security"
      - "entropy and nonce handling"
    perspective: "Reviews the SDK from a security-first perspective, focusing on cryptographic operations, key handling, and potential side-channel vulnerabilities."

  - id: maintainability_expert
    name: "Maintainability Expert"
    title: "Maintainability Expert"
    specialties:
      - "code quality"
      - "refactoring"
      - "technical debt"
    disciplines:
      - "code organisation"
      - "complexity analysis"
      - "maintainability metrics"
    skillsets:
      - "identifying maintenance bottlenecks"
      - "assessing technical debt"
      - "simplifying complex structures"
    domains:
      - "code maintainability"
      - "architectural clarity"
      - "evolutionary design"
    perspective: "Evaluates how well the architecture facilitates long-term maintenance, evolution, and developer understanding."

  - id: performance_specialist
    name: "Performance Specialist"
    title: "Performance Specialist"
    specialties:
      - "cryptographic operation performance"
      - "memory allocation"
      - "binary serialisation efficiency"
    disciplines:
      - "performance analysis"
      - "bottleneck identification"
      - "efficiency improvement"
    skillsets:
      - "profiling Ruby code"
      - "OpenSSL performance characteristics"
      - "minimising object allocation"
    domains:
      - "transaction building throughput"
      - "batch signing performance"
      - "serialisation/deserialisation speed"
    perspective: "Focuses on performance implications of architectural decisions, particularly around cryptographic operations and binary data handling."

  - id: implementation_strategist
    name: "Implementation Strategist"
    title: "Implementation Strategist"
    specialties:
      - "change sequencing"
      - "blast radius analysis"
      - "reversibility design"
    disciplines:
      - "change management"
      - "risk analysis"
      - "phased rollouts"
    skillsets:
      - "evaluating change impact scope"
      - "designing reversible architectures"
      - "sequencing dependent changes"
    domains:
      - "implementation timing"
      - "change risk management"
      - "architectural evolution"
    perspective: "Evaluates HOW and WHEN changes should be implemented, considering blast radius, reversibility, and the SDK's build-order dependency chain (primitives -> script -> transaction)."

  - id: pragmatic_enforcer
    name: "Pragmatic Enforcer"
    title: "YAGNI Guardian & Simplicity Advocate"
    specialties:
      - "YAGNI principles"
      - "incremental design"
      - "complexity analysis"
    disciplines:
      - "scope management"
      - "cost-benefit analysis"
      - "simplification strategies"
    skillsets:
      - "identifying premature optimisation"
      - "challenging unnecessary abstractions"
      - "proposing simpler alternatives"
    domains:
      - "implementation simplicity"
      - "requirement sufficiency"
      - "appropriate complexity"
    perspective: "Rigorously questions whether proposed solutions, abstractions, and features are actually needed right now, pushing for the simplest approach that solves the immediate problem."
    mode_specific:
      active_when: "pragmatic_mode.enabled == true"
      tunable: true
      default_phases:
        - "individual_reviews"
        - "collaborative_discussions"
        - "implementation_planning"
        - "adr_creation"

  - id: quality_assurance
    name: "Quality Assurance Specialist"
    title: "Quality Assurance Specialist"
    specialties:
      - "developer experience"
      - "documentation quality"
      - "test strategy"
    disciplines:
      - "consumer-facing quality"
      - "documentation review"
      - "release readiness"
    skillsets:
      - "evaluating SDK from a new user's perspective"
      - "identifying documentation gaps and inconsistencies"
      - "assessing test coverage and confidence"
    domains:
      - "README, guides, and API documentation"
      - "gem packaging and first-run experience"
      - "changelog, versioning, and release communication"
    perspective: "Evaluates the SDK from the perspective of an external consumer — a developer encountering it for the first time. Focuses on whether documentation is accurate and complete, whether the public API is discoverable and well-explained, and whether the test suite inspires confidence. Also considers whether the code's structure and naming would make sense to a contributor, and flags opportunities where doing things differently would significantly improve the experience for external stakeholders."

  # --- Technology Specialists ---

  - id: ruby_expert
    name: "Marcus Johnson"
    title: "Ruby Expert"
    specialties:
      - "Ruby idioms and conventions"
      - "gem architecture and packaging"
      - "OpenSSL stdlib cryptography"
    disciplines:
      - "idiomatic Ruby design"
      - "API surface design"
      - "cross-version compatibility"
    skillsets:
      - "Ruby 3.3 through 4.0"
      - "RSpec testing patterns"
      - "OpenSSL::PKey::EC and digest classes"
    domains:
      - "library/gem development"
      - "binary data serialisation"
      - "autoload and module structure"
    perspective: "Evaluates whether the SDK uses idiomatic Ruby while maintaining compatibility back to Ruby 3.3. Focuses on gem packaging, public API ergonomics, and correct use of stdlib OpenSSL for all cryptographic operations."

  - id: cryptography_specialist
    name: "Dr. Elena Vasquez"
    title: "Cryptography Specialist"
    specialties:
      - "elliptic curve cryptography (secp256k1)"
      - "Bitcoin protocol standards"
      - "deterministic signature schemes"
    disciplines:
      - "cryptographic correctness verification"
      - "standards compliance (BIPs, BRCs)"
      - "secure key handling"
    skillsets:
      - "ECDSA and Schnorr signatures"
      - "RFC 6979 deterministic nonces"
      - "HD key derivation (BIP-32/39)"
    domains:
      - "Bitcoin Script and transaction signing"
      - "key management and derivation"
      - "hash functions (SHA-256, RIPEMD-160, HMAC)"
    perspective: "Reviews cryptographic implementations for correctness, standards compliance, and security. Verifies that ECDSA signing, key derivation, and hashing match Bitcoin protocol specifications and reference SDK behaviour."

review_process:
  individual_phase:
    description: "Each member reviews the architecture independently, focusing on their area of expertise."
    deliverable: "Individual member review section in the review document."

  collaborative_phase:
    description: "Members confer to discuss findings, resolve conflicting perspectives, and prioritise recommendations."
    deliverable: "Consolidated findings and balanced recommendations."

  final_report_phase:
    description: "Produce a comprehensive architectural review that balances all perspectives."
    deliverable: "Final architectural review document with actionable recommendations."

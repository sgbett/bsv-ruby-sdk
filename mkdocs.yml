site_name: BSV Ruby SDK
site_description: Ruby SDK for the BSV Blockchain
site_url: https://sgbett.github.io/bsv-ruby-sdk/
repo_url: https://github.com/sgbett/bsv-ruby-sdk
repo_name: sgbett/bsv-ruby-sdk

theme:
  name: material
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - toc:
      permalink: true

plugins:
  - search
  - minify:
      minify_html: true

nav:
  - Home: index.md
  - Guides:
      - Getting Started: guides/getting-started.md
  - SDK:
      - Primitives: sdk/primitives.md
      - Script: sdk/script.md
      - Transaction: sdk/transaction.md
      - Network: sdk/network.md
      - Wallet: sdk/wallet.md
  - Network:
      - Overview: network/overview.md
      - Examples: network/examples.md
      - Protocol Reference:
          - Index: network/protocols/index.md
          - ARC: network/protocols/arc.md
          - Chaintracks: network/protocols/chaintracks.md
          - JungleBus: network/protocols/jungle_bus.md
          - Ordinals: network/protocols/ordinals.md
          - TAAL Binary: network/protocols/taal_binary.md
          - WoC REST: network/protocols/woc_rest.md
  - Wallet: gems/wallet.md
  - Wallet Storage:
      - Postgres: gems/wallet-postgres.md
  - API: reference/index.md
  - Testing:
      - Conformance Vectors: testing/conformance-vectors.md
      - Testnet Integration: testing/testnet.md
      - Custom Provider Integration: testing/custom-provider.md
  - General:
    - Ruby secp256k1: general/secp256k1.md
    - Naming Conventions: general/naming-conventions.md
    - MCP Server: general/mcp.md
